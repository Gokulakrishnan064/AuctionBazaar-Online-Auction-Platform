<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – AuctionBazaar</title>
  <link rel="icon" type="image/png" href="images/logo.png?v=2">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-container-3d {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .auth-card-3d {
      background: var(--bg-card);
      backdrop-filter: blur(25px);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      padding: 2.8rem 2.2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-card);
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-auction" id="mainNavbar"></nav>

<div class="auth-container-3d">
  <div class="auth-card-3d">
    <div class="text-center mb-4">
      <div class="footer-brand fs-2 mb-2 d-flex align-items-center justify-content-center gap-2"><img src="images/logo.png" alt="AuctionBazaar GK Logo" style="height:48px;width:auto;filter:drop-shadow(0 2px 10px rgba(245,158,11,0.5));">AuctionBazaar</div>
      <p style="color:var(--text-muted);font-size:0.9rem;">Register to start buying and selling on the live platform</p>
    </div>

    <form id="registerForm" onsubmit="submitRegister(event)">
      <div class="row g-2 mb-3">
        <div class="col-sm-6">
          <label class="form-label-auction">First Name</label>
          <input type="text" class="form-control-auction w-100" id="firstName" placeholder="Gokul" required>
        </div>
        <div class="col-sm-6">
          <label class="form-label-auction">Last Name</label>
          <input type="text" class="form-control-auction w-100" id="lastName" placeholder="Krishnan" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label-auction">Username</label>
        <input type="text" class="form-control-auction w-100" id="userName" placeholder="gokul06" required>
      </div>

      <div class="mb-3">
        <label class="form-label-auction">Email Address</label>
        <input type="email" class="form-control-auction w-100" id="email" placeholder="gokul@example.com" required>
      </div>

      <div class="mb-4">
        <label class="form-label-auction">Password</label>
        <input type="password" class="form-control-auction w-100" id="password" placeholder="••••••••" required minlength="6">
      </div>

      <button type="submit" class="btn btn-gold w-100 py-3 fs-6 mb-3" id="regBtn">
        <i class="bi bi-person-plus-fill me-2"></i>Create Account
      </button>

      <div class="text-center" style="font-size:0.88rem;color:var(--text-muted);">
        Already registered? <a href="login.html" style="color:var(--gold);font-weight:600;text-decoration:none;">Sign In</a>
      </div>
    </form>
  </div>
</div>

<div id="mainFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  renderNavbar('register');
  renderFooter();

  async function submitRegister(e) {
    e.preventDefault();
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const userName = document.getElementById('userName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const btn = document.getElementById('regBtn');
    btn.disabled = true;

    const res = await apiCall('/users/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        firstname: firstName,
        lastname: lastName,
        username: userName,
        email: email,
        password: password
      })
    });

    btn.disabled = false;
    if (res.ok && (res.data?.responseCode === 200 || res.data?.user || res.status === 200)) {
      if (res.data.user) {
        setUser(res.data.user);
      }
      playAudioFx('win');
      launchConfetti();
      showToast('Registration successful! Welcome.', 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    } else {
      playAudioFx('alert');
      const errMsg = res.data?.statusMessage || res.data?.message || 'User already exists with this email.';
      showToast(errMsg + ' Redirecting to Sign In...', 'error');
      setTimeout(() => { window.location.href = 'login.html'; }, 1800);
    }
  }
</script>
</body>
</html>
