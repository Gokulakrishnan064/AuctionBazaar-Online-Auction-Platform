<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile – AuctionBazaar 3D</title>
  <link rel="icon" type="image/png" href="images/logo.png?v=2">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-auction" id="mainNavbar"></nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="hud-panel">
        <div class="d-flex align-items-center gap-3 mb-4 pb-3" style="border-bottom:1px solid var(--border-light);">
          <div style="width:60px;height:60px;border-radius:50%;background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#fff;" id="profileAvatar">
            <i class="bi bi-person-fill"></i>
          </div>
          <div>
            <h3 style="font-family:var(--font-heading);margin:0;" id="profileName">User Name</h3>
            <p style="color:var(--cyan);font-size:0.85rem;margin:0;" id="profileEmail">user@example.com</p>
          </div>
        </div>

        <form id="profileForm" onsubmit="updateProfile(event)">
          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label-auction">First Name</label>
              <input type="text" class="form-control-auction w-100" id="firstName" required>
            </div>
            <div class="col-sm-6">
              <label class="form-label-auction">Last Name</label>
              <input type="text" class="form-control-auction w-100" id="lastName" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label-auction">Username</label>
            <input type="text" class="form-control-auction w-100" id="userName" required>
          </div>

          <div class="mb-4">
            <label class="form-label-auction">Email Address</label>
            <input type="email" class="form-control-auction w-100" id="email" required>
          </div>

          <button type="submit" class="btn btn-gold w-100 py-3" id="saveProfileBtn">
            <i class="bi bi-floppy-fill me-2"></i>Save Profile Changes
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="mainFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  renderNavbar('profile');
  renderFooter();
  requireAuth();

  function loadProfile() {
    const user = getUser();
    if (!user) return;

    document.getElementById('profileName').textContent = `${user.firstName || ''} ${user.lastName || user.userName || ''}`;
    document.getElementById('profileEmail').textContent = user.email || '';
    document.getElementById('firstName').value = user.firstName || '';
    document.getElementById('lastName').value = user.lastName || '';
    document.getElementById('userName').value = user.userName || user.username || '';
    document.getElementById('email').value = user.email || '';
  }

  async function updateProfile(e) {
    e.preventDefault();
    const user = getUser();
    if (!user) return;

    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const userName = document.getElementById('userName').value.trim();
    const email = document.getElementById('email').value.trim();

    const btn = document.getElementById('saveProfileBtn');
    btn.disabled = true;

    const res = await apiCall('/users/update-user', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: user.id, firstName, lastName, userName, email })
    });

    btn.disabled = false;
    if (res.ok && (res.data?.responseCode === 200 || res.status === 200)) {
      setUser({ ...user, firstName, lastName, userName, email });
      showToast('Profile updated successfully!', 'success');
      loadProfile();
    } else {
      showToast(res.data?.message || 'Failed to update profile', 'error');
    }
  }

  loadProfile();
</script>
</body>
</html>
