<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bids – AuctionBazaar 3D</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-auction" id="mainNavbar"></nav>

<div class="container py-5">
  <div class="hud-panel">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3" style="border-bottom:1px solid var(--border-light);">
      <div>
        <h2 style="font-family:var(--font-heading);"><i class="bi bi-hammer me-2" style="color:var(--cyan);"></i>My Active Bids</h2>
        <p style="color:var(--text-muted);font-size:0.9rem;margin:0;">Track all bids placed from your account</p>
      </div>
      <span class="bid-badge fs-6" id="bidsCountBadge">0 Bids</span>
    </div>

    <div class="table-responsive">
      <table class="table table-dark table-hover align-middle mb-0" style="background:transparent;">
        <thead>
          <tr style="border-color:var(--border-light);color:var(--text-muted);font-size:0.82rem;text-transform:uppercase;">
            <th>Auction ID</th>
            <th>Bid Amount</th>
            <th>Placed Time</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="bidsTableBody">
          <tr>
            <td colspan="4" class="text-center py-4" style="color:var(--text-muted);">
              <div class="spinner-border text-cyan spinner-border-sm me-2" role="status"></div>Loading your bids...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="mainFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  renderNavbar('my-bids');
  renderFooter();
  requireAuth();

  async function loadMyBids() {
    const user = getUser();
    if (!user) return;

    const res = await apiCall(`/bids/getBidsByUserId/${user.id}`);
    const tbody = document.getElementById('bidsTableBody');
    const bidsList = res.data?.allBids || (Array.isArray(res.data) ? res.data : []);

    document.getElementById('bidsCountBadge').textContent = `${bidsList.length} Bids`;

    if (!res.ok || bidsList.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4" style="color:var(--text-muted);">No bids placed yet. <a href="auctions.html" style="color:var(--cyan);">Explore auctions</a></td></tr>`;
      return;
    }

    tbody.innerHTML = bidsList.map(b => `
      <tr style="border-color:var(--border-light);">
        <td><span style="font-weight:600;color:var(--cyan);">#${b.auctionId || b.id}</span></td>
        <td><span style="font-family:var(--font-display);font-weight:700;color:var(--text-primary);">${formatCurrency(b.amount || 0)}</span></td>
        <td><span style="color:var(--text-muted);font-size:.85rem;">${formatDate(b.createdDate || b.date)}</span></td>
        <td><span class="status-badge-live">Active Bid</span></td>
      </tr>
    `).join('');
  }

  loadMyBids();
</script>
</body>
</html>
